<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Hardware Hunters 4052</title>
    <meta name="description" content="A rhythm game where every cleared round scans a real NASA machine into the Archive." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23c2dde4' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23c9374c'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div id="fx-flash" aria-hidden="true"></div>
    <div id="boot" role="progressbar" aria-label="Loading the game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <p class="boot-title">HARDWARE HUNTERS <span>4052</span></p>
      <div class="boot-bar"><i></i></div>
      <p class="boot-pct">Loading… 0%</p>
      <p class="boot-fact" aria-live="polite"></p>
    </div>
    <main id="app" tabindex="-1"></main>
    <div class="corner-tools">
      <button id="help-toggle" class="tool" aria-label="How to play">?</button>
      <button id="music-toggle" class="tool" aria-pressed="true" aria-label="Background music on">♪</button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
